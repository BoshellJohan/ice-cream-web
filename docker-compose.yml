# Los valores se leen del archivo `.env` de la raíz (no versionado).
# Copia `.env.example` a `.env` antes de levantar los servicios.
version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-helados_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./helados-api
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-helados_dev}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
    volumes:
      - ./helados-api:/app
      - /app/node_modules
    depends_on:
      - postgres

  ui:
    build:
      context: ./helados-ui
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
    volumes:
      - ./helados-ui:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
