version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helados
      POSTGRES_PASSWORD: helados
      POSTGRES_DB: helados_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./helados-api
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://helados:helados@postgres:5432/helados_dev
      JWT_SECRET: dev-secret-change-in-production
    volumes:
      - ./helados-api:/app
      - /app/node_modules
    depends_on:
      - postgres

  ui:
    build:
      context: ./helados-ui
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
    volumes:
      - ./helados-ui:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
